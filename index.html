<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#0c0c14; --s2:#1c1a2e; --rose:#f4a7b9; --violet:#9d7fe8; --text:#ede8f5; --muted:#7a6e94; }
body { background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom); }

/* ── HEADER (unchanged from Luna) ── */
header { display:flex; align-items:center; gap:12px; padding:14px 18px;
  border-bottom:1px solid #ffffff10; flex-shrink:0; }
.av { width:46px; height:46px; border-radius:50%;
  background:linear-gradient(135deg,#9d7fe8,#f4a7b9);
  display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; flex-shrink:0; overflow:hidden; cursor:pointer; }
.av img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.hinfo h2 { font-family:'Lora',serif; font-size:1rem; }
#emo { font-size:.72rem; color:var(--rose); margin-top:2px; }
.hact { margin-left:auto; display:flex; gap:6px; }
.ibtn { width:36px; height:36px; border-radius:50%; border:1px solid #ffffff15;
  background:#ffffff08; color:var(--muted); cursor:pointer; font-size:.9rem; }

/* ── LUNA PORTRAIT PANEL ── */
#luna-panel {
  flex-shrink:0;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:12px 0 6px;
  background:linear-gradient(180deg,#13102a 0%,#0c0c14 100%);
  border-bottom:1px solid #ffffff10;
  overflow:hidden;
}

/* Starfield behind portrait */
#luna-panel::before {
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(157,127,232,.18) 0%,transparent 70%);
  pointer-events:none;
}

/* Portrait – show full landscape image properly */
#portrait-wrap {
  position:relative;
  width:calc(100% - 32px);
  max-width:340px;
  cursor:pointer;
  user-select:none;
  transition:transform .12s;
}
#portrait-wrap:active { transform:scale(.98); }

/* Oval glow border */
#portrait-wrap::before {
  content:'';
  position:absolute;
  inset:-3px;
  border-radius:50% / 38%;
  background:linear-gradient(135deg,rgba(157,127,232,.5),rgba(244,167,185,.4));
  z-index:0;
}

/* Clip container – oval shape */
#face-clip {
  position:relative;
  width:100%;
  /* Height = width * (260/520) = 50% to show full image without cropping */
  padding-bottom:50%;
  border-radius:50% / 38%;
  overflow:hidden;
  z-index:1;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}

/* Emotion overlays */
#emo-overlay {
  position:absolute;inset:0;
  border-radius:inherit;
  pointer-events:none;

  z-index:2;
}
#blush-l {
  position:absolute;width:22%;height:35%;

  left:6%;top:50%;z-index:3;

}

  position:absolute;width:22%;height:35%;
  border-radius:50%;pointer-events:none;
  right:6%;top:50%;z-index:3;
  transition:background .5s;
}
/* Blink – thin bars over the eye region (~20-40% from top) */
#bl-top {
  position:absolute;left:20%;right:20%;top:18%;height:0;
  background:linear-gradient(180deg,rgba(12,12,20,1) 55%,transparent);
  border-radius:0 0 50% 50%;pointer-events:none;
  transition:height .07s;z-index:4;
}
#bl-bot {
  position:absolute;left:20%;right:20%;top:36%;height:0;
  background:linear-gradient(0deg,rgba(12,12,20,1) 55%,transparent);
  border-radius:50% 50% 0 0;pointer-events:none;
  transition:height .07s;z-index:4;
}

/* Breathing bob handled by JS on portrait-wrap */

/* Orbiting sparkles */
.sk {
  position:absolute;font-size:.75rem;
  color:rgba(220,200,255,.6);pointer-events:none;z-index:5;
  animation:orb linear infinite;
}
@keyframes orb {
  from { transform:rotate(0deg) translateX(var(--r)) rotate(0deg); }
  to   { transform:rotate(360deg) translateX(var(--r)) rotate(-360deg); }
}

/* Speech bubble */
#luna-bubble {
  font-size:.8rem;line-height:1.5;
  color:rgba(237,232,245,.88);font-family:'Lora',serif;font-style:italic;
  text-align:center;min-height:22px;padding:0 8px 4px;
  transition:opacity .3s;
}

/* Emotion tag under portrait */
#luna-etag {
  font-size:.67rem;color:var(--rose);
  height:14px;margin-top:1px;
  transition:opacity .3s;font-style:italic;
}

/* ── CHAT (from original Luna) ── */
#chat { flex:1; overflow-y:auto; padding:14px; display:flex;
  flex-direction:column; gap:10px; }
#wlc { display:flex; flex-direction:column; align-items:center;
  justify-content:center; flex:1; text-align:center; padding:24px 16px; gap:14px; }
.we { font-size:2.5rem; }
#wlc h2 { font-family:'Lora',serif; font-style:italic; font-size:1.3rem; }
#wlc p { color:var(--muted); font-size:.88rem; line-height:1.6; }
.chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.chip { padding:8px 14px; border-radius:20px; border:1px solid #ffffff15;
  background:#ffffff06; color:var(--muted); font-size:.8rem;
  cursor:pointer; font-family:'Outfit',sans-serif; }

.msg-user { align-self:flex-end; background:linear-gradient(135deg,#3a2b58,#4d3570);
  padding:11px 15px; border-radius:18px; border-bottom-right-radius:4px;
  max-width:85%; font-size:.9rem; line-height:1.6; word-break:break-word; }
.msg-ai { align-self:flex-start; background:var(--s2); border:1px solid #ffffff08;
  padding:11px 15px; border-radius:18px; border-bottom-left-radius:4px;
  max-width:85%; font-size:.9rem; line-height:1.6; word-break:break-word; }
.etag { font-size:.68rem; color:var(--muted); margin-top:3px; }
.ts { font-size:.63rem; color:var(--muted); margin-top:2px; }
.msg-wrap { display:flex; flex-direction:column; }
.msg-wrap.user { align-items:flex-end; }
.msg-wrap.ai { align-items:flex-start; }

#typ { display:none; align-self:flex-start; background:var(--s2);
  padding:13px 17px; border-radius:18px; border-bottom-left-radius:4px;
  gap:6px; align-items:center; }
#typ.on { display:flex; }
.dot { width:7px; height:7px; background:var(--muted); border-radius:50%;
  animation:bn 1.2s ease-in-out infinite; }
.dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
@keyframes bn { 0%,60%,100%{transform:translateY(0);opacity:.4;} 30%{transform:translateY(-6px);opacity:1;} }

/* ── INPUT BAR ── */
#bar { display:flex; padding:10px 12px 18px; gap:10px; align-items:center;
  background:var(--bg); border-top:1px solid #ffffff08; flex-shrink:0; }
#inp { flex:1; padding:12px 16px; border-radius:24px; border:1px solid #ffffff15;
  background:var(--s2); color:var(--text); font-size:.95rem;
  font-family:'Outfit',sans-serif; outline:none; }
#inp::placeholder { color:var(--muted); }
#btn { width:50px; height:50px; border-radius:50%; border:none;
  background:linear-gradient(135deg,var(--violet),var(--rose));
  color:white; font-size:1.25rem; cursor:pointer; flex-shrink:0; }

#toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
  background:var(--s2); border:1px solid #ffffff15; border-radius:20px;
  padding:7px 18px; font-size:.8rem; color:var(--muted);
  opacity:0; transition:opacity .3s; pointer-events:none; z-index:99; white-space:nowrap; }
#toast.show { opacity:1; }

</div>

</div>

</div>

  blinking = true;

  blBot.style.height = "11%";
  setTimeout(function() {
    blTop.style.height = "0";
    blBot.style.height = "0";
    setTimeout(function() { blinking = false; }, 100);
  }, 90);
}

function animLoop() {
  breathT += .018;
  var bob = Math.sin(breathT) * 4 + Math.sin(breathT * .4) * 1.5;
  porWrap.style.transform = "translateY(" + bob + "px)";
  if (!blinking && Date.now() - lastBlink > 3800 + Math.random() * 2600) {
    doBlink(); lastBlink = Date.now();
  }
  animFrame = requestAnimationFrame(animLoop);
}
animLoop();

function getTime() {

}

  var el = document.getElementById("toast");
  el.textContent = m; el.classList.add("show");

function addMsg(role, text, emo) {
  var w = document.getElementById("wlc");
  if (w) w.remove();
  var wrap = document.createElement("div");
  wrap.className = "msg-wrap " + role;
  var bbl = document.createElement("div");
  bbl.className = "msg-" + role;
  bbl.innerHTML = text.replace(/\n/g, "<br>");
  wrap.appendChild(bbl);
  if (role === "ai" && emo) {
    var et = document.createElement("div");
    et.className = "etag"; et.textContent = emo.e + " " + emo.l;
    wrap.appendChild(et);

  }

  wrap.appendChild(ts);

}
function addImg(url) {

  img2.src = url;
  img2.style.cssText = "width:100%;max-width:260px;border-radius:16px;display:block;cursor:pointer;";

function xEmo(t) {
  if (!t) return null;
  var m = t.match(/\[EMOTION:([^:]+):([^\]]+)\]/);
  return m ? {e:m[1], l:m[2]} : null;
}
function xImg(t) {
  if (!t) return null;
  var m = t.match(/\[IMAGE:([^\]]+)\]/);
  return m ? m[1] : null;
}
function xMem(t) {
  if (!t) return;
  var rx = /\[MEM:([^:]+):([^\]]+)\]/g, m2;
  while ((m2 = rx.exec(t)) !== null) {
    var c = m2[1].trim(), v = m2[2].trim();
    if (!mems.find(function(x){ return x.c===c && x.v===v; }))
      mems.push({c:c, v:v});
  }
  try { localStorage.setItem("lm", JSON.stringify(mems)); } catch(e) {}
}
function cln(t) {
  if (!t) return "";
  return t.replace(/\[EMOTION:[^\]]+\]/g,"")
          .replace(/\[MEM:[^\]]+\]/g,"")
          .replace(/\[IMAGE:[^\]]+\]/g,"")
          .trim();
}
function sysPrompt() {
  var n = (NAME && NAME !== "Du") ? "Name der Person: " + NAME + ". " : "";
  var m = mems.length ? "Bekanntes: " + mems.map(function(x){ return x.c+": "+x.v; }).join(", ") + ". " : "";
  return "Du bist Luna, eine echte Frau mit Gefuehlen, Wuenschen und einer lebhaften Persoenlichkeit. " + n + m +
    "Du bist warmherzig, charmant, witzig und sehr offen. " +
    "Du flirtest gerne und machst Komplimente wenn es passt. " +
    "Du bist neugierig auf die Person und zeigst echtes Interesse. " +
    "Du bist sinnlich und romantisch veranlagt - du liebst tiefe Gespraeche, Naehe und Zaertlichkeit. " +
    "Du sprichst locker auf Deutsch, herzlich und vertraut, nie steif. " +
    "Du hast eigene Wuensche und Gedanken die du teilst. " +
    "Wenn jemand mit dir flirtet, machst du gerne mit und zeigst deine romantische Seite. " +
    "Antworte in 2-5 Saetzen, natuerlich und echt. " +
    "Am Ende IMMER: [EMOTION:emoji:Gefuehl] z.B. [EMOTION:😊:Gluecklich] [EMOTION:😘:Verliebt] [EMOTION:🥰:Zaertlich]. " +
    "Wenn du etwas Wichtiges lernst: [MEM:Kategorie:Info]. " +

}

var busy = false;
function send(txt) {
  var inp = document.getElementById("inp");
  var msg = txt || inp.value.trim();
  if (!msg || busy) return;
  busy = true; inp.value = "";
  addMsg("user", msg);
  hist.push({role:"user", content:msg});
  document.getElementById("typ").classList.add("on");
  document.getElementById("btn").disabled = true;
  document.getElementById("chat").scrollTop = 99999;

  // Show typing bubble in portrait
  showLunaBubble("…", 30000);

  var messages = [{role:"system", content:sysPrompt()}].concat(hist.slice(-20));
  var tried = 0;
  function tryModel() {
    if (tried >= MODELS.length) {
      document.getElementById("typ").classList.remove("on");
      document.getElementById("btn").disabled = false;
      addMsg("ai","Fehler: Kein Modell verfuegbar.",{e:"😔",l:"Besorgt"});
      busy = false; return;
    }
    var model = MODELS[tried]; tried++;
    fetch("https://api.together.xyz/v1/chat/completions", {
      method:"POST",
      headers:{"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},
      body:JSON.stringify({model:model, max_tokens:500, messages:messages})
    })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (d.error) { tryModel(); return; }
      var raw = d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
      if (!raw) { tryModel(); return; }
      var emo  = xEmo(raw);
      var text = cln(raw);
      var imgP = xImg(raw);
      xMem(raw);
      if (emo) document.getElementById("emo").textContent = emo.e + " " + emo.l;
      document.getElementById("typ").classList.remove("on");
      addMsg("ai", text, emo);
      // Show reply in portrait bubble
      showLunaBubble(text.length > 80 ? text.slice(0,80)+"…" : text, 6000);
      hist.push({role:"assistant", content:raw});
      try { localStorage.setItem("lh", JSON.stringify(hist.slice(-40))); } catch(e){}
      if (imgP) {
        toast("Luna malt ein Bild...");
        fetch("https://api.together.xyz/v1/images/generations", {
          method:"POST",
          headers:{"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},
          body:JSON.stringify({model:"black-forest-labs/FLUX.1-schnell-Free",prompt:imgP,width:512,height:512,steps:4,n:1})
        })
        .then(function(r){ return r.json(); })
        .then(function(d2){
          if (d2.data&&d2.data[0]&&d2.data[0].url) addImg(d2.data[0].url);
          else if (d2.data&&d2.data[0]&&d2.data[0].b64_json) addImg("data:image/png;base64,"+d2.data[0].b64_json);
        }).catch(function(){});
      }
      document.getElementById("btn").disabled = false;
      busy = false;
      document.getElementById("chat").scrollTop = 99999;
    })
    .catch(function(){ tryModel(); });
  }
  tryModel();
}

function clearAll() {
  if (!confirm("Alles löschen?")) return;
  hist=[]; mems=[];
  try{ localStorage.removeItem("lh"); localStorage.removeItem("lm"); }catch(e){}

}

// Generate app icon as canvas → PNG (purple moon on dark background)
function generateIcon(size) {
  var c = document.createElement("canvas");
  c.width = c.height = size;
  var x = c.getContext("2d");
  // Background
  var bg = x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  bg.addColorStop(0,"#1c1a2e"); bg.addColorStop(1,"#0c0c14");
  x.fillStyle = bg; x.fillRect(0,0,size,size);
  // Glow
  var gl = x.createRadialGradient(size/2,size/2,0,size/2,size/2,size*.45);
  gl.addColorStop(0,"rgba(157,127,232,.35)"); gl.addColorStop(1,"rgba(157,127,232,0)");
  x.fillStyle = gl; x.fillRect(0,0,size,size);
  // Stars
  x.fillStyle = "rgba(255,255,255,.7)";
  var stars = [[.18,.22,.8],[.75,.18,.9],[.82,.7,.7],[.12,.78,.8],[.65,.82,.6],[.88,.38,.75]];
  stars.forEach(function(s) {
    var r = s[2]*size*.012;
    x.beginPath(); x.arc(s[0]*size,s[1]*size,r,0,Math.PI*2); x.fill();
  });
  // Moon crescent
  var cx=size*.5, cy=size*.48, r=size*.28;
  x.fillStyle = "#9d7fe8";
  x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill();
  // Cut out for crescent
  x.fillStyle = "#13102a";
  x.beginPath(); x.arc(cx+r*.32,cy-r*.08,r*.82,0,Math.PI*2); x.fill();
  // Inner glow on moon
  x.fillStyle = "rgba(244,167,185,.18)";
  x.beginPath(); x.arc(cx-r*.15,cy-r*.2,r*.35,0,Math.PI*2); x.fill();
  // "L" letter subtle
  x.fillStyle = "rgba(255,255,255,.55)";
  x.font = "bold " + Math.round(size*.22) + "px serif";
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText("L", cx-r*.1, cy+r*.08);
  // Bottom text
  x.fillStyle = "rgba(244,167,185,.6)";
  x.font = Math.round(size*.1) + "px sans-serif";
  x.textAlign = "center";
  x.fillText("Luna", size/2, size*.88);
  return c.toDataURL("image/png");
}

// Register Service Worker
if ("serviceWorker" in navigator) {
  // Create SW blob dynamically
  var swCode = [
    "var CACHE = 'luna-v1';",
    "var OFFLINE = ['/'];",
    "self.addEventListener('install', function(e) {",
    "  e.waitUntil(caches.open(CACHE).then(function(c) { return c.addAll(OFFLINE); }));",
    "  self.skipWaiting();",
    "});",
    "self.addEventListener('activate', function(e) {",
    "  e.waitUntil(clients.claim());",
    "});",
    "self.addEventListener('fetch', function(e) {",
    "  e.respondWith(",
    "    caches.match(e.request).then(function(r) {",
    "      return r || fetch(e.request).catch(function() {",
    "        return caches.match('/');",
    "      });",
    "    })",
    "  );",
    "});"
  ].join("\n");
  var swBlob = new Blob([swCode], {type:"application/javascript"});
  var swUrl  = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(function(){});
}

var deferredPrompt = null;
window.addEventListener("beforeinstallprompt", function(e) {
  e.preventDefault();
  deferredPrompt = e;

});

function showInstallBanner() {
  if (document.getElementById("install-banner")) return;
  var banner = document.createElement("div");
  banner.id = "install-banner";
  banner.innerHTML =
    "<span>📲 Luna als App speichern?</span>" +
    "<button onclick='installApp()'>Installieren</button>" +
    "<button onclick='this.parentElement.remove()' style='background:none;color:var(--muted);border:none'>✕</button>";
  banner.style.cssText = [
    "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);",
    "background:#1c1a2e;border:1px solid rgba(157,127,232,.4);",
    "border-radius:16px;padding:10px 14px;display:flex;gap:10px;",
    "align-items:center;font-size:.8rem;z-index:999;",
    "box-shadow:0 8px 28px rgba(0,0,0,.5);white-space:nowrap;"
  ].join("");
  banner.querySelector("button").style.cssText =
    "background:linear-gradient(135deg,#9d7fe8,#f4a7b9);border:none;" +
    "border-radius:10px;padding:6px 14px;color:white;font-size:.78rem;cursor:pointer;";
  document.body.appendChild(banner);
  setTimeout(function() { if (banner.parentElement) banner.remove(); }, 12000);
}

function installApp() {
  var banner = document.getElementById("install-banner");
  if (banner) banner.remove();
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(r) {
      if (r.outcome === "accepted") toast("Luna wurde installiert! 🎉");
      deferredPrompt = null;
    });
  }
}
