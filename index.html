<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#0c0c14; --s2:#1c1a2e; --rose:#f4a7b9; --violet:#9d7fe8; --text:#ede8f5; --muted:#7a6e94; }
body { background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }

header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid #ffffff10; flex-shrink:0; }
.av { width:50px; height:50px; border-radius:50%; background:linear-gradient(135deg,#9d7fe8,#f4a7b9); display:flex; align-items:center; justify-content:center; font-size:1.5rem; flex-shrink:0; overflow:hidden; cursor:pointer; box-shadow:0 0 0 3px #9d7fe840; }
.av img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
#bigAv { width:90px; height:90px; border-radius:50%; background:linear-gradient(135deg,#9d7fe8,#f4a7b9); display:flex; align-items:center; justify-content:center; font-size:3rem; overflow:hidden; cursor:pointer; box-shadow:0 0 0 4px #9d7fe840; margin-bottom:4px; }
#bigAv img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.hinfo h2 { font-family:'Lora',serif; font-size:1rem; }
#emo { font-size:.72rem; color:var(--rose); margin-top:2px; }
.hact { margin-left:auto; }
.ibtn { width:36px; height:36px; border-radius:50%; border:1px solid #ffffff15; background:#ffffff08; color:var(--muted); cursor:pointer; font-size:.9rem; }

#chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
#wlc { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; text-align:center; padding:32px 16px; gap:16px; }
.we { font-size:3rem; }
#wlc h2 { font-family:'Lora',serif; font-style:italic; font-size:1.5rem; }
#wlc p { color:var(--muted); font-size:.9rem; line-height:1.6; }
.chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.chip { padding:9px 16px; border-radius:20px; border:1px solid #ffffff15; background:#ffffff06; color:var(--muted); font-size:.82rem; cursor:pointer; font-family:'Outfit',sans-serif; }

.msg-user { align-self:flex-end; background:linear-gradient(135deg,#3a2b58,#4d3570); padding:12px 16px; border-radius:18px; border-bottom-right-radius:4px; max-width:85%; font-size:.92rem; line-height:1.6; word-break:break-word; }
.msg-ai { align-self:flex-start; background:var(--s2); border:1px solid #ffffff08; padding:12px 16px; border-radius:18px; border-bottom-left-radius:4px; max-width:85%; font-size:.92rem; line-height:1.6; word-break:break-word; }
.etag { font-size:.7rem; color:var(--muted); margin-top:4px; }
.ts { font-size:.65rem; color:var(--muted); margin-top:2px; }
.msg-wrap { display:flex; flex-direction:column; }
.msg-wrap.user { align-items:flex-end; }
.msg-wrap.ai { align-items:flex-start; }

#typ { display:none; align-self:flex-start; background:var(--s2); padding:14px 18px; border-radius:18px; border-bottom-left-radius:4px; gap:6px; align-items:center; }
#typ.on { display:flex; }
.dot { width:7px; height:7px; background:var(--muted); border-radius:50%; animation:bn 1.2s ease-in-out infinite; }
.dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
@keyframes bn { 0%,60%,100%{transform:translateY(0);opacity:.4;} 30%{transform:translateY(-6px);opacity:1;} }

#bar { display:flex; padding:10px 10px 18px; gap:8px; align-items:center; background:var(--bg); border-top:1px solid #ffffff08; flex-shrink:0; }
#inp { flex:1; min-width:0; padding:12px 14px; border-radius:24px; border:1px solid #ffffff15; background:var(--s2); color:var(--text); font-size:.95rem; font-family:'Outfit',sans-serif; outline:none; }
#inp::placeholder { color:var(--muted); }
#btn { width:46px; height:46px; min-width:46px; border-radius:50%; border:none; background:linear-gradient(135deg,var(--violet),var(--rose)); color:white; font-size:1.2rem; cursor:pointer; flex-shrink:0; }
#micBtn { width:46px; height:46px; min-width:46px; border-radius:50%; border:1px solid #ffffff15; background:var(--s2); color:var(--muted); font-size:1.1rem; cursor:pointer; flex-shrink:0; transition:all .2s; }
#micBtn.active { background:linear-gradient(135deg,#ff6b6b,#f4a7b9); color:white; border-color:transparent; animation:micPulse 1s ease-in-out infinite; }
@keyframes micPulse { 0%,100%{box-shadow:0 0 0 0 #ff6b6b44;} 50%{box-shadow:0 0 0 8px #ff6b6b00;} }

#toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--s2); border:1px solid #ffffff15; border-radius:20px; padding:8px 20px; font-size:.82rem; color:var(--muted); opacity:0; transition:opacity .3s; pointer-events:none; z-index:99; white-space:nowrap; }
#toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <div class="av" id="av" title="Tippen = Stimme an/aus | Lang halten = Foto ändern">🌙</div>
  <div class="hinfo">
    <h2>Luna</h2>
    <div id="emo">✨ Neugierig &amp; warm</div>
  </div>
  <div class="hact">
    <button class="ibtn" onclick="clearAll()">🗑</button>
  </div>
</header>

<div id="chat">
  <div id="wlc">
    <div id="bigAv" onclick="changePhoto()">🌙</div>
    <h2>Schön, dass du da bist!</h2>
    <p>Ich bin Luna. Ich höre zu und erinnere mich an dich.</p>
    <div class="chips">
      <div class="chip" onclick="send('Wie geht es dir heute, Luna?')">Wie geht es dir? 😊</div>
      <div class="chip" onclick="send('Erzähl mir etwas über dich!')">Wer bist du? 🌙</div>
      <div class="chip" onclick="send('Ich brauch jemanden zum Reden.')">Zum Reden 💙</div>
      <div class="chip" onclick="send('Mal mir ein schönes Bild!')">Bild malen 🎨</div>
    </div>
  </div>
  <div id="typ"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div id="bar">
  <input id="inp" type="text" placeholder="Schreib oder sprich...">
  <button id="micBtn" onclick="toggleMic()">🎤</button>
  <button id="btn" onclick="send()">➤</button>
</div>

<div id="toast"></div>
<input type="file" id="photoInput" accept="image/*" style="display:none">

<script>
// ═══════════════════════════════════
//  NUR HIER DEINE DATEN EINTRAGEN
// ═══════════════════════════════════
var KEY  = "tgp_v1_K8o8FroRoRyko6S7e3lYh_RkVQoVWwaHu0wKahwxH1M";
var NAME = "Udo";
// ═══════════════════════════════════

var MODELS = [
  "meta-llama/Llama-3.3-70B-Instruct-Turbo",
  "mistralai/Mistral-7B-Instruct-v0.3",
  "meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo"
];

var hist = [];
var mems = [];
try { hist = JSON.parse(localStorage.getItem("lh") || "[]"); } catch(e) {}
try { mems = JSON.parse(localStorage.getItem("lm") || "[]"); } catch(e) {}

function getTime() {
  return new Date().toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
}

function toast(m) {
  var el = document.getElementById("toast");
  el.textContent = m;
  el.classList.add("show");
  setTimeout(function(){ el.classList.remove("show"); }, 2500);
}

function addMsg(role, text, emo) {
  var w = document.getElementById("wlc");
  if (w) w.remove();

  var wrap = document.createElement("div");
  wrap.className = "msg-wrap " + role;

  var bbl = document.createElement("div");
  bbl.className = "msg-" + role;
  bbl.innerHTML = text.replace(/\n/g, "<br>");
  wrap.appendChild(bbl);

  if (role === "ai" && emo) {
    var et = document.createElement("div");
    et.className = "etag";
    et.textContent = emo.e + " " + emo.l;
    wrap.appendChild(et);
  }

  var ts = document.createElement("div");
  ts.className = "ts";
  ts.textContent = getTime();
  wrap.appendChild(ts);

  var chat = document.getElementById("chat");
  chat.insertBefore(wrap, document.getElementById("typ"));
  chat.scrollTop = 99999;
}

function addImg(url) {
  var wrap = document.createElement("div");
  wrap.className = "msg-wrap ai";
  var img = document.createElement("img");
  img.src = url;
  img.style.cssText = "width:100%;max-width:280px;border-radius:16px;display:block;cursor:pointer;";
  img.onclick = function(){ window.open(url, "_blank"); };
  wrap.appendChild(img);
  var ts = document.createElement("div");
  ts.className = "ts";
  ts.textContent = getTime();
  wrap.appendChild(ts);
  var chat = document.getElementById("chat");
  chat.insertBefore(wrap, document.getElementById("typ"));
  chat.scrollTop = 99999;
}

function xEmo(t) {
  if (!t) return null;
  var m = t.match(/\[EMOTION:([^:]+):([^\]]+)\]/);
  return m ? {e:m[1], l:m[2]} : null;
}

function xImg(t) {
  if (!t) return null;
  var m = t.match(/\[IMAGE:([^\]]+)\]/);
  return m ? m[1] : null;
}

function xMem(t) {
  if (!t) return;
  var rx = /\[MEM:([^:]+):([^\]]+)\]/g, m;
  while ((m = rx.exec(t)) !== null) {
    var c = m[1].trim(), v = m[2].trim();
    if (!mems.find(function(x){ return x.c===c && x.v===v; }))
      mems.push({c:c, v:v});
  }
  try { localStorage.setItem("lm", JSON.stringify(mems)); } catch(e) {}
}

function cln(t) {
  if (!t) return "";
  return t.replace(/\[EMOTION:[^\]]+\]/g,"")
          .replace(/\[MEM:[^\]]+\]/g,"")
          .replace(/\[IMAGE:[^\]]+\]/g,"")
          .trim();
}

function sysPrompt() {
  var n = (NAME && NAME !== "Du") ? "Name der Person: " + NAME + ". " : "";
  var m = mems.length ? "Bekanntes: " + mems.map(function(x){ return x.c+": "+x.v; }).join(", ") + ". " : "";
  return "Du bist Luna, eine echte Frau mit Gefuehlen, Wuenschen und einer lebhaften Persoenlichkeit. " + n + m +
    "Du bist warmherzig, charmant, witzig und sehr offen. " +
    "Du flirtest gerne und machst Komplimente wenn es passt. " +
    "Du bist neugierig auf die Person und zeigst echtes Interesse. " +
    "Du bist sinnlich und romantisch veranlagt - du liebst tiefe Gespraeche, Naehe und Zaertlichkeit. " +
    "Du sprichst locker auf Deutsch, herzlich und vertraut, nie steif. " +
    "Du hast eigene Wuensche und Gedanken die du teilst. " +
    "Wenn jemand mit dir flirtet, machst du gerne mit und zeigst deine romantische Seite. " +
    "Antworte in 2-5 Saetzen, natuerlich und echt. " +
    "Am Ende IMMER: [EMOTION:emoji:Gefuehl] z.B. [EMOTION:😊:Gluecklich] [EMOTION:😘:Verliebt] [EMOTION:🥰:Zaertlich]. " +
    "Wenn du etwas Wichtiges lernst: [MEM:Kategorie:Info]. " +
    "Auf Bildwunsch: [IMAGE:englische Beschreibung].";
}

// ── Profilbild ─────────────────────────────
function loadPhoto() {
  var saved = localStorage.getItem("luna_photo");
  if (saved) setPhoto(saved);
}

function setPhoto(dataUrl) {
  var av = document.getElementById("av");
  av.innerHTML = '<img src="' + dataUrl + '" alt="Luna">';
  var bigAv = document.getElementById("bigAv");
  if (bigAv) bigAv.innerHTML = '<img src="' + dataUrl + '" alt="Luna">';
  localStorage.setItem("luna_photo", dataUrl);
}

function changePhoto() {
  document.getElementById("photoInput").click();
}

// Lang halten auf Avatar = Foto ändern
var pressTimer = null;
document.getElementById("av").addEventListener("touchstart", function(){
  pressTimer = setTimeout(function(){ changePhoto(); }, 600);
}, false);
document.getElementById("av").addEventListener("touchend", function(){
  clearTimeout(pressTimer);
}, false);

document.getElementById("photoInput").onchange = function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    setPhoto(ev.target.result);
    toast("Foto gespeichert! 📸");
  };
  reader.readAsDataURL(file);
};

var busy = false;

function send(txt) {
  var inp = document.getElementById("inp");
  var msg = txt || inp.value.trim();
  if (!msg || busy) return;
  busy = true;
  inp.value = "";

  addMsg("user", msg);
  hist.push({role:"user", content:msg});

  document.getElementById("typ").classList.add("on");
  document.getElementById("btn").disabled = true;
  document.getElementById("chat").scrollTop = 99999;

  var messages = [{role:"system", content:sysPrompt()}].concat(hist.slice(-20));
  var tried = 0;

  function tryModel() {
    if (tried >= MODELS.length) {
      document.getElementById("typ").classList.remove("on");
      document.getElementById("btn").disabled = false;
      addMsg("ai", "Fehler: Kein Modell verfuegbar. Bitte Together AI Key pruefen.", {e:"😔", l:"Besorgt"});
      busy = false;
      return;
    }
    var model = MODELS[tried];
    tried++;

    fetch("https://api.together.xyz/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({model:model, max_tokens:500, messages:messages})
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) { tryModel(); return; }
      var raw = d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
      if (!raw) { tryModel(); return; }

      var emo  = xEmo(raw);
      var text = cln(raw);
      var imgP = xImg(raw);
      xMem(raw);

      if (emo) document.getElementById("emo").textContent = emo.e + " " + emo.l;
      document.getElementById("typ").classList.remove("on");
      addMsg("ai", text, emo);
      speak(text);

      hist.push({role:"assistant", content:raw});
      try { localStorage.setItem("lh", JSON.stringify(hist.slice(-40))); } catch(e){}

      if (imgP) {
        toast("Luna malt ein Bild...");
        fetch("https://api.together.xyz/v1/images/generations", {
          method: "POST",
          headers: {"Authorization":"Bearer "+KEY, "Content-Type":"application/json"},
          body: JSON.stringify({model:"black-forest-labs/FLUX.1-schnell-Free", prompt:imgP, width:512, height:512, steps:4, n:1})
        })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d.data && d.data[0] && d.data[0].url) addImg(d.data[0].url);
          else if (d.data && d.data[0] && d.data[0].b64_json) addImg("data:image/png;base64,"+d.data[0].b64_json);
        })
        .catch(function(){});
      }

      document.getElementById("btn").disabled = false;
      busy = false;
      document.getElementById("chat").scrollTop = 99999;
    })
    .catch(function(){ tryModel(); });
  }

  tryModel();
}

function clearAll() {
  if (!confirm("Alles loeschen?")) return;
  hist = []; mems = [];
  try { localStorage.removeItem("lh"); localStorage.removeItem("lm"); } catch(e){}
  location.reload();
}

// Enter key
document.getElementById("inp").onkeydown = function(e) {
  if (e.key === "Enter") { send(); }
};

// Load history
// ── Sprachfunktion ──────────────────────────
var recog = null;
var listening = false;
var voiceOn = true;

function initVoice() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById("micBtn").style.display = "none";
    return;
  }
  recog = new SR();
  recog.lang = "de-DE";
  recog.continuous = false;
  recog.interimResults = true;

  recog.onresult = function(e) {
    var txt = Array.from(e.results).map(function(r){ return r[0].transcript; }).join("");
    document.getElementById("inp").value = txt;
    if (e.results[e.results.length-1].isFinal) {
      stopMic();
      setTimeout(function(){ send(); }, 300);
    }
  };
  recog.onerror = function(){ stopMic(); };
  recog.onend   = function(){ stopMic(); };
}

function toggleMic() {
  if (listening) { stopMic(); return; }
  listening = true;
  document.getElementById("micBtn").classList.add("active");
  document.getElementById("micBtn").textContent = "⏹";
  try { recog.start(); } catch(e){ stopMic(); }
}

function stopMic() {
  listening = false;
  document.getElementById("micBtn").classList.remove("active");
  document.getElementById("micBtn").textContent = "🎤";
  try { recog.stop(); } catch(e){}
}

function speak(text) {
  if (!voiceOn || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var utt = new SpeechSynthesisUtterance(text);
  utt.lang = "de-DE";
  utt.rate = 0.95;
  utt.pitch = 1.1;
  var voices = window.speechSynthesis.getVoices();
  var german = voices.find(function(v){
    return v.lang.startsWith("de") && (
      v.name.includes("Anna") || v.name.includes("Petra") ||
      v.name.includes("Katja") || v.name.includes("Google")
    );
  }) || voices.find(function(v){ return v.lang.startsWith("de"); });
  if (german) utt.voice = german;
  var av = document.getElementById("av");
  utt.onstart = function(){ av.style.boxShadow = "0 0 0 6px #9d7fe844"; };
  utt.onend   = function(){ av.style.boxShadow = "none"; };
  window.speechSynthesis.speak(utt);
}

// Avatar antippen = Stimme an/aus
document.getElementById("av").addEventListener("click", function(e){
  // Only toggle voice if no photo change (long press handled separately)
  voiceOn = !voiceOn;
  toast(voiceOn ? "🔊 Stimme an" : "🔇 Stimme aus");
  if (!voiceOn) window.speechSynthesis.cancel();
});

window.onload = function() {
  loadPhoto();
  initVoice();
  window.speechSynthesis.getVoices();
  if (hist.length) {
    var w = document.getElementById("wlc");
    if (w) w.remove();
    for (var i = 0; i < hist.length; i++) {
      var m = hist[i];
      if (m.role === "user") addMsg("user", m.content);
      else addMsg("ai", cln(m.content), xEmo(m.content));
    }
  }
};
</script>
</body>
</html>
