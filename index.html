<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna</title>
<style>
body { background:#0c0c14; color:#ede8f5; font-family:sans-serif; display:flex; flex-direction:column; height:100dvh; margin:0; }
#chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.user { align-self:flex-end; background:#4d3570; padding:10px 14px; border-radius:16px; max-width:80%; }
.ai { align-self:flex-start; background:#1c1a2e; padding:10px 14px; border-radius:16px; max-width:80%; }
#bar { display:flex; padding:12px; gap:10px; background:#0c0c14; border-top:1px solid #333; }
#inp { flex:1; padding:12px; border-radius:20px; border:1px solid #333; background:#1c1a2e; color:#ede8f5; font-size:1rem; outline:none; }
#btn { padding:12px 20px; border-radius:20px; border:none; background:#9d7fe8; color:white; font-size:1rem; cursor:pointer; }
</style>
</head>
<body>
<div id="chat">
  <div class="ai">Hallo! Ich bin Luna. Schreib mir etwas 🌙</div>
</div>
<div id="bar">
  <input id="inp" type="text" placeholder="Schreib etwas...">
  <button id="btn">Senden</button>
</div>
<script>
var KEY = "tgp_v1_K8o8FroRoRyko6S7e3lYh_RkVQoVWwaHu0wKahwxH1M";

function addMsg(role, text) {
  var d = document.createElement("div");
  d.className = role;
  d.textContent = text;
  document.getElementById("chat").appendChild(d);
  document.getElementById("chat").scrollTop = 99999;
}

function send() {
  var inp = document.getElementById("inp");
  var msg = inp.value.trim();
  if (!msg) return;
  inp.value = "";
  addMsg("user", msg);
  addMsg("ai", "Warte...");

  fetch("https://api.together.xyz/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "meta-llama/Llama-3.3-70B-Instruct-Turbo",
      max_tokens: 200,
      messages: [
        {role: "system", content: "Du bist Luna, eine freundliche KI. Antworte kurz auf Deutsch."},
        {role: "user", content: msg}
      ]
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    var last = document.querySelector(".ai:last-child");
    if (d.choices && d.choices[0]) {
      last.textContent = d.choices[0].message.content;
    } else {
      last.textContent = "Fehler: " + JSON.stringify(d.error);
    }
  })
  .catch(function(e){
    document.querySelector(".ai:last-child").textContent = "Netzwerkfehler: " + e.message;
  });
}

document.getElementById("btn").onclick = function() { send(); };
document.getElementById("inp").onkeydown = function(e) {
  if (e.key === "Enter") { send(); }
};
</script>
</body>
</html>
